
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ES6 To-Do App</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>My To-Do List</h1>
        <p>Experiment 07 &amp; 08: ES6, DOM Manipulation and Event Handling</p>

        <form id="taskForm">
            <input id="taskInput" type="text" placeholder="Enter a task..." required>
            <button type="submit">Add Task</button>
        </form>

        <p id="taskCount">0 tasks</p>
        <ul id="taskList"></ul>
    </main>
</body>
</html>
