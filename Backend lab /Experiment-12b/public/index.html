<!DOCTYPE html>
<html>
<head>
    <title>Session and Local Storage To-Do List</title>
</head>

<body>

    <h1>Session and Local Storage To-Do List</h1>

    <input
        type="text"
        id="todoInput"
        placeholder="Enter a task"
    >

    <button onclick="addTodo()">Add Todo</button>

    <h2>Your Tasks</h2>

    <ul id="todoList"></ul>

    <hr>

    <h2>Theme</h2>

    <button onclick="setDarkTheme()">Dark Theme</button>
    <button onclick="setLightTheme()">Light Theme</button>

    <script src="app.js"></script>

</body>
</html>
